name: CI

# The enforced test + build gate. azure-deploy.yml ships the image but never
# runs the suite — this workflow does, on every PR and every push to main, so a
# red X lands on the commit BEFORE (PR) or alongside (main) the deploy. Turn on
# "Require status checks to pass" for the `test` job in branch protection to make
# it a true merge gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref cancels the in-flight CI run — no point finishing
# a suite for a commit that's already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # The suite's globalSetup reads TEST_DATABASE_URL (falls back to this same
      # default locally) and pins DATABASE_URL to it for the production db.ts
      # singleton. Points at the PostgreSQL the first step starts.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/diagramatix_test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # PostgreSQL 18 on localhost:5432 — started here, not as a service
      # container, so a registry out of anonymous quota falls through to the
      # next (.github/scripts/start-postgres.sh).
      - name: Start PostgreSQL 18
        run: bash .github/scripts/start-postgres.sh

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: diagramatix/package-lock.json

      - name: Install dependencies
        working-directory: ./diagramatix
        # Full install (incl. devDeps — vitest, prisma) — NOT --omit=dev like the
        # deploy job, the suite needs the dev toolchain.
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./diagramatix
        # The app imports app/generated/prisma/client — generate it before the
        # suite (and the build) load it.
        run: npx prisma generate

      - name: Run test suite
        working-directory: ./diagramatix
        # globalSetup applies the schema to the test DB via `prisma db push`
        # then every file runs against it (fileParallelism is off in the config,
        # so the shared DB is never raced).
        run: npm test

      - name: Production build
        working-directory: ./diagramatix
        # Catches build/type breaks here (PR) instead of in the Docker build on
        # main — e.g. a dependency present in the root package.json but missing
        # from diagramatix/package.json. No DB needed for the build itself.
        run: npm run build

  # Browser/e2e layer (Playwright) — the journeys the unit suite can't reach.
  # Separate job so the fast unit `test` job isn't slowed; its own Postgres
  # (jobs don't share containers). The webServer (scripts/e2e-server.cjs)
  # db-pushes, seeds the SubscriptionLevel catalog, builds non-standalone, and
  # serves on :3001 against this service — so the job only needs deps + a browser.
  e2e:
    runs-on: ubuntu-latest
    env:
      # No .env on the runner — credentials auth needs a JWT secret + trusted host.
      # Dummy values only; the e2e flows use email/password, not these integrations.
      AUTH_SECRET: e2e-ci-secret-not-for-production
      AUTH_TRUST_HOST: 'true'
      AZURE_CLIENT_ID: e2e-dummy
      AZURE_CLIENT_SECRET: e2e-dummy
      AZURE_TENANT_ID: e2e-dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # PostgreSQL 18 on localhost:5432 — started here, not as a service
      # container, so a registry out of anonymous quota falls through to the
      # next (.github/scripts/start-postgres.sh).
      - name: Start PostgreSQL 18
        run: bash .github/scripts/start-postgres.sh

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: diagramatix/package-lock.json

      - name: Install dependencies
        working-directory: ./diagramatix
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./diagramatix
        run: npx prisma generate

      - name: Install Playwright Chromium
        working-directory: ./diagramatix
        run: npx playwright install --with-deps chromium

      - name: Run e2e (Playwright)
        working-directory: ./diagramatix
        # CI=true → no server reuse, retries flaky tests once. e2e-server.cjs is
        # the webServer (db push + seed + non-standalone build + next start).
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: diagramatix/playwright-report/
          retention-days: 7
          # Don't warn when the report is absent (e.g. the DB service never came up,
          # so Playwright produced nothing) — the failing test step is the real signal.
          if-no-files-found: ignore
